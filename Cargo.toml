[package]
name = "skyrim-mod-sync"
version = "0.3.0"
edition = "2021"
rust-version = "1.91"
description = "Capture, compare and reproduce deployed Skyrim instances"
license = "GPL-3.0-or-later"

[lib]
path = "rust/lib.rs"

[[bin]]
name = "skyrim-mod-sync"
path = "rust/main.rs"

[[test]]
name = "sync"
path = "rust/tests/sync.rs"

[dependencies]
base64 = "0.22"
blake3 = "1.8"
ed25519-dalek = { version = "2.2", features = ["rand_core"] }
rand = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "io-util"] }
iroh = "=1.3.0"
iroh-blobs = { version = "=0.103.1", default-features = false, features = ["fs-store"] }
clap = { version = "4.6", features = ["derive"] }
ctrlc = "3.4"
flate2 = "1.1"
fs2 = "0.4"
libc = "0.2"
pelite = "0.10"
rpassword = "7"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
tempfile = "3"
xxhash-rust = { version = "0.8", features = ["xxh64"] }
zip = { version = "2.4", default-features = false, features = ["deflate-flate2", "flate2"] }

[profile.release]
lto = "thin"
strip = true
