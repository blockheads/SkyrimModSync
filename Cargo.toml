[package]
name = "skyrim-mod-sync"
version = "0.4.1"
edition = "2021"
rust-version = "1.91"
description = "Share a Skyrim mod setup with friends: sync, load into the game, play, unload"
license = "GPL-3.0-or-later"

[lib]
path = "rust/lib.rs"

[[bin]]
name = "sms"
path = "rust/main.rs"

[dependencies]
base64 = "0.22"
blake3 = "1.8"
clap = { version = "4.6", features = ["derive"] }
ctrlc = "3.4"
dirs = "6"
ed25519-dalek = { version = "2.2", features = ["rand_core"] }
flate2 = "1.1"
fs2 = "0.4"
iroh = "=1.3.0"
iroh-blobs = { version = "=0.103.1", default-features = false, features = ["fs-store"] }
libc = "0.2"
pelite = "0.10"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json"] }
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sevenz-rust2 = "0.20"
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "io-util"] }
zip = { version = "2.4", default-features = false, features = ["deflate-flate2", "flate2"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.55"

[profile.release]
lto = "thin"
strip = true
