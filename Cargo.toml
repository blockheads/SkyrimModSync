[package]
name = "skyrim-mod-sync"
version = "0.10.3"
edition = "2021"
rust-version = "1.91"
description = "Share a Skyrim mod setup with friends: sync, load into the game, play, unload"
license = "GPL-3.0-or-later"
repository = "https://github.com/blockheads/SkyrimModSync"

[lib]
path = "rust/lib.rs"

[[bin]]
name = "sms"
path = "rust/main.rs"

[dependencies]
blake3 = "1.8"
clap = { version = "4.6", features = ["derive"] }
ctrlc = "3.4"
dirs = "6"
eframe = { version = "0.33.3", default-features = false, features = ["glow", "default_fonts", "x11"] }
flate2 = "1.1"
getrandom = "0.3"
iroh = "=1.3.0"
rayon = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json"] }
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sevenz-rust2 = "0.20"
tempfile = "3"
unrar = "0.5.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "io-util", "fs", "sync"] }
zip = { version = "2.4", default-features = false, features = ["deflate-flate2", "flate2"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_System_Console"] }
winreg = "0.55"

[profile.release]
# Small binary; the hot code paths (hashing, unpacking, crypto) stay optimized for speed.
lto = "fat"
codegen-units = 1
opt-level = "s"
strip = true

[profile.release.package.blake3]
opt-level = 3
[profile.release.package.lzma-rust2]
opt-level = 3
[profile.release.package.miniz_oxide]
opt-level = 3
[profile.release.package.ring]
opt-level = 3
